# Reglas conservadoras: errores de sintaxis, nombres indefinidos y comparaciones erróneas.
# Los módulos de pkhosting/ se encadenan con "import *" a propósito (ver panel.py), por eso F403/F405 no se activan.
target-version = "py312"
line-length = 140
extend-exclude = ["docs"]

[lint]
select = ["E9", "F63", "F7", "F82", "F4", "F5", "F6", "F811", "F841", "B006", "B018"]
ignore = ["F403", "F405", "F401"]
