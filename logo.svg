<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pk_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f1138"/>
      <stop offset="50%" stop-color="#0e071c"/>
      <stop offset="100%" stop-color="#05020a"/>
    </linearGradient>
    <linearGradient id="pk_top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="35%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="pk_left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="pk_right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#1e0538"/>
    </linearGradient>
    <linearGradient id="pk_cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="pk_purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <filter id="pk_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Container badge / Liquid Glass squircle -->
  <rect width="64" height="64" rx="15" fill="url(#pk_bg)" stroke="rgba(168,85,247,0.38)" stroke-width="1.2"/>
  <circle cx="32" cy="32" r="24" fill="rgba(168,85,247,0.12)" filter="url(#pk_glow)"/>

  <!-- Minecraft Server Crystal Cube -->
  <g transform="translate(0, 1)">
    <!-- Top Face (Minecraft block grid / crystal facets) -->
    <polygon points="32,9 53,21 32,33 11,21" fill="url(#pk_top)"/>
    <path d="M24,17 L40,26 M28,14 L44,23 M17,25 L33,33" stroke="rgba(255,255,255,0.4)" stroke-width="0.8"/>
    <!-- Center Beacon Light -->
    <circle cx="32" cy="21" r="2.2" fill="#38bdf8" filter="url(#pk_glow)"/>

    <!-- Left Face (Amethyst side) -->
    <polygon points="11,21 32,33 32,55 11,43" fill="url(#pk_left)"/>
    
    <!-- Right Face (Obsidian side) -->
    <polygon points="32,33 53,21 53,43 32,55" fill="url(#pk_right)"/>

    <!-- Integrated Monogram: "P" on left face, "K" on right face -->
    <!-- Letter P -->
    <g filter="url(#pk_glow)">
      <!-- P stem -->
      <path d="M18,31 L23,34 L23,48 L18,45 Z" fill="url(#pk_purple)"/>
      <!-- P loop -->
      <path d="M23,34 L29,37 L29,43 L23,40 Z" fill="url(#pk_purple)"/>
      <!-- P inner cutout -->
      <polygon points="23,36 26.5,38 26.5,41 23,39" fill="#7e22ce"/>
    </g>

    <!-- Letter K -->
    <g filter="url(#pk_glow)">
      <!-- K stem -->
      <path d="M35,37 L40,34 L40,48 L35,51 Z" fill="url(#pk_cyan)"/>
      <!-- K upper diagonal -->
      <path d="M40,40 L47,35 L48.5,36.5 L42.5,42.5 Z" fill="url(#pk_cyan)"/>
      <!-- K lower diagonal -->
      <path d="M41,41.5 L48.5,47.5 L46.5,49 L39.5,43.5 Z" fill="url(#pk_cyan)"/>
    </g>

    <!-- Glowing Rim Wireframe -->
    <polyline points="11,21 32,9 53,21" stroke="rgba(255,255,255,0.65)" stroke-width="0.9"/>
    <line x1="32" y1="33" x2="32" y2="55" stroke="rgba(192,132,252,0.5)" stroke-width="0.9"/>
    <polyline points="11,21 11,43 32,55 53,43 53,21" stroke="rgba(168,85,247,0.3)" stroke-width="0.8"/>
  </g>
</svg>